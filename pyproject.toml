[project]
name = "claimdocbench"
version = "0.1.0.dev0"
description = "Multilingual, adversarial claim-document benchmark for AI claims agents: scans, photos, forgeries and prompt injection (EN/BM/ZH)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Mohamed Mahdi" }]
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1,<4",
    "numpy>=2,<3",
    "pillow>=11,<13",
    "playwright>=1.48,<2",
    "pydantic>=2.9,<3",
    "pyyaml>=6,<7",
]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
]

[project.scripts]
claimdocbench = "claimdocbench.cli:main"

[project.urls]
Repository = "https://github.com/MohamedMahdiCS/claimdocbench"

[project.optional-dependencies]
# Apple Vision OCR for the OCR variant of the baseline (macOS only).
ocr = ["ocrmac>=1.0; sys_platform == 'darwin'"]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.13",
    "pre-commit>=4",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claimdocbench"]

[tool.hatch.build.targets.wheel.force-include]
# Ship the frozen split fingerprints so `claimdocbench download` can verify downloads.
"splits/manifest.json" = "claimdocbench/data/splits.json"

[tool.hatch.build.targets.sdist]
exclude = ["out/", "private/", "runs/", "release/", ".hypothesis/"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Translations legitimately use full-width CJK punctuation and long label strings.
"src/claimdocbench/i18n.py" = ["RUF001", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["hypothesis.*", "ocrmac.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
