name: Leaderboard

on:
  push:
    branches: [main]
    paths: ["leaderboard/**", "src/claimdocbench/leaderboard.py"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # GitHub Pages needs a public repo on the free plan.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build page
        run: |
          uv sync --locked
          uv run claimdocbench leaderboard leaderboard/results/*.json --out site/index.html \
            --note "$(cat leaderboard/NOTE.txt)" --footer "$(cat leaderboard/FOOTER.txt)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
